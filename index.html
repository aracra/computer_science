<style>
  :root {
    --bg: #f1f5f9;

    --primary: #2563eb;

    --muted: #64748b;
    --border: #e2e8f0;
    --ready-bg: #dbeafe;

    --wait-bg: #f1f5f9;
    --wait-txt: #64748b;

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.55;
  }
  .hero {

  .badge {

    font-weight: 700;
    margin-bottom: 10px;
  }
  .hero h1 {
    margin: 0 0 8px;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .hero p {

  }
  .container {

  .tab-bar {

    padding-bottom: 10px;
    margin-bottom: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .subject-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .subj-card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  }
  .subj-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .subj-title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
  }
  .status-pill {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .status-ready { background: var(--ready-bg); color: var(--ready-txt); }
  .status-wait { background: var(--wait-bg); color: var(--wait-txt); }
  .exam-links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .exam-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 700;
    transition: all 0.15s;
  }
  .exam-btn:hover {
    background: #eff6ff;
    border-color: var(--primary);
    color: var(--primary);
  }
  .exam-btn span.arrow {
    color: var(--primary);
    font-weight: 800;
  }
  .placeholder-box {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .guide-card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 22px;
    border: 1px solid var(--border);
  }
  .guide-card h3 { margin: 0 0 8px; font-size: 15px; }
  .guide-card p, .guide-card li { font-size: 13px; color: var(--muted); }
  .guide-card ul { margin: 6px 0 0; padding-left: 18px; }
  code {
    background: #f1f5f9;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 12px;
    color: #0f172a;
  }
</style>
